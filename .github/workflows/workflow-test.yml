name: workflow-test

permissions:
  contents: read

# Repo-local regression tests. Independent of the template-managed docker workflows, so it
# stays in place across template refreshes.
#
# NOTE: branch-parity compares this branch against the sibling release branch, so push both
# refs in one push (git push origin master libtorrentv1) or the first push leaves CI red
# until the sibling catches up.
on:
  push:
    branches:
      - master
      - libtorrentv1
  pull_request:
    branches:
      - master
      - libtorrentv1
  workflow_dispatch:

jobs:
  regression-test:
    name: deluge plugin patch regression test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run deluge webui plugin patch regression test
        run: bash tests/test-deluge-webui-plugin-patch.sh build/root/install.sh

  branch-parity:
    name: plugin patch parity across branches
    # parity is only meaningful on the two release branches, for a push or a manual run
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/libtorrentv1'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: diff the patch block and test against the other branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            other_branch=libtorrentv1
          else
            other_branch=master
          fi
          echo "comparing ${GITHUB_REF_NAME} against ${other_branch}"
          if ! git fetch --depth=1 origin "${other_branch}"; then
            echo "::error::could not fetch ${other_branch}"
            exit 1
          fi
          if ! git show "FETCH_HEAD:build/root/install.sh" > /tmp/other-install.sh; then
            echo "::error::build/root/install.sh missing on ${other_branch}"
            exit 1
          fi
          extract_block() {
            # fail closed: the range operator would print to EOF when the end marker is gone
            awk -v b='# deluge plugin webui patch - begin' -v e='# deluge plugin webui patch - end' \
              '$0 == b { started = 1 } started { print } started && $0 == e { closed = 1; exit } END { exit !(started && closed) }' "$1"
          }
          extract_block build/root/install.sh > /tmp/block-current.sh \
            || { echo "::error::deluge plugin webui patch block is not marker complete on ${GITHUB_REF_NAME}"; exit 1; }
          extract_block /tmp/other-install.sh > /tmp/block-other.sh \
            || { echo "::error::deluge plugin webui patch block is not marker complete on ${other_branch}"; exit 1; }
          if [[ ! -s /tmp/block-current.sh || ! -s /tmp/block-other.sh ]]; then
            echo "::error::deluge plugin webui patch block missing on ${GITHUB_REF_NAME} or ${other_branch}"
            exit 1
          fi
          # a marker only block is not a patch, so require a sentinel line from the body
          if ! grep -qF 'deluge_web_lookup_raw=' /tmp/block-current.sh \
            || ! grep -qF 'deluge_web_lookup_raw=' /tmp/block-other.sh; then
            echo "::error::deluge plugin webui patch block is missing its body on ${GITHUB_REF_NAME} or ${other_branch}"
            exit 1
          fi
          if ! diff -u /tmp/block-other.sh /tmp/block-current.sh; then
            echo "::error::deluge plugin webui patch block differs between ${GITHUB_REF_NAME} and ${other_branch}"
            exit 1
          fi
          if ! git show "FETCH_HEAD:tests/test-deluge-webui-plugin-patch.sh" > /tmp/other-test.sh; then
            echo "::error::regression test missing on ${other_branch}"
            exit 1
          fi
          if [[ ! -s /tmp/other-test.sh || ! -s tests/test-deluge-webui-plugin-patch.sh ]]; then
            echo "::error::regression test is empty on ${GITHUB_REF_NAME} or ${other_branch}"
            exit 1
          fi
          if ! diff -u /tmp/other-test.sh tests/test-deluge-webui-plugin-patch.sh; then
            echo "::error::regression test differs between ${GITHUB_REF_NAME} and ${other_branch}"
            exit 1
          fi
          if ! git show "FETCH_HEAD:.github/workflows/workflow-test.yml" > /tmp/other-workflow.yml; then
            echo "::error::workflow-test.yml missing on ${other_branch}"
            exit 1
          fi
          if [[ ! -s /tmp/other-workflow.yml || ! -s .github/workflows/workflow-test.yml ]]; then
            echo "::error::workflow-test.yml is empty on ${GITHUB_REF_NAME} or ${other_branch}"
            exit 1
          fi
          if ! diff -u /tmp/other-workflow.yml .github/workflows/workflow-test.yml; then
            echo "::error::workflow-test.yml differs between ${GITHUB_REF_NAME} and ${other_branch}"
            exit 1
          fi
          echo "plugin patch block and regression test match on both branches"
